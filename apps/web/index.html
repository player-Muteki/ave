<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVE · Native Agentic Video Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f131a;
        --panel: #171d27;
        --border: #2a3444;
        --text: #e6ecf5;
        --muted: #9aa7bd;
        --accent: #3b82f6;
        --ok: #10b981;
        --warn: #f59e0b;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
      }
      button.secondary {
        background: #253042;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input {
        background: #10151e;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script defer src="./workbench.js"></script>
  </body>
</html>
