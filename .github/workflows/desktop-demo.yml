name: AVE installed desktop demo

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run ID of the AVE desktop candidate to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      upstream: ${{ steps.source.outputs.upstream }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the candidate source and Linux installer
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          record=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          jq -e '.path == ".github/workflows/desktop-candidate.yml" and .head_branch == "main" and .event == "workflow_dispatch"' <<< "$record" > /dev/null
          sha=$(jq -r .head_sha <<< "$record")
          upstream=$(git show "${sha}:research/upstream.json" | jq -er '.references[] | select(.path == "paseo") | .commit')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          gh run download "$BUILD_RUN" -n "AVE-$sha-linux-x64" -D package
          python3 release/desktop/verify-candidate.py package "$sha"
      - name: Create one shared offset source with the packaged FFmpeg
        run: |
          chmod +x package/*.AppImage
          package/*.AppImage --appimage-extract 'resources/native-media/bin/ffmpeg' > /dev/null
          mkdir sample
          release/desktop/make-demo-source.sh "$PWD/squashfs-root/resources/native-media/bin/ffmpeg" sample/demo-source.mkv
          (cd sample && sha256sum demo-source.mkv > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-source
          path: sample/
          if-no-files-found: error

  demo:
    needs: sample
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: mac-arm64 }
          - { runner: macos-26-intel, target: mac-x64 }
          - { runner: windows-2025, target: win-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: getpaseo/paseo
          ref: ${{ needs.sample.outputs.upstream }}
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: downstream/paseo/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify the installer and common source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          BUILD_SHA: ${{ needs.sample.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          gh run download "$BUILD_RUN" -n "AVE-$BUILD_SHA-$TARGET" -D package
          python release/desktop/verify-candidate.py package "$BUILD_SHA"
          gh run download "$GITHUB_RUN_ID" -n demo-source -D sample
          python - <<'PY'
          import hashlib, pathlib
          sample = pathlib.Path("sample/demo-source.mkv")
          assert hashlib.sha256(sample.read_bytes()).hexdigest() == sample.with_name("SHA256SUMS").read_text().split()[0]
          PY
          git archive "$BUILD_SHA:downstream/paseo" | tar -x -C runtime
          git show "$BUILD_SHA:release/desktop/identity.patch" | git -C runtime apply -
          cp downstream/paseo/packages/desktop/e2e/{packaged-app-smoke,video-release-demo,verify-linux-image}.js runtime/packages/desktop/e2e/
      - name: Prepare the desktop test client
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run build:server:clean
      - name: Prepare Linux desktop sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth
          sudo install -d -m 0755 /opt/ave
          sudo install -m 0755 package/*.AppImage /opt/ave/AVE.AppImage
          sudo install -m 0644 release/desktop/ave-appimage.apparmor /etc/apparmor.d/ave-appimage
          sudo apparmor_parser -r /etc/apparmor.d/ave-appimage
      - name: Install, edit, review, play and download
        env:
          AVE_DEMO_MODE: manual
          AVE_DEMO_SOURCE: ${{ github.workspace }}/sample/demo-source.mkv
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/installed-demo
        run: |
          case "$RUNNER_OS" in
            macOS) release/desktop/check-dmg.sh package/*.dmg runtime/packages/desktop ;;
            Windows) pwsh -NoProfile -Command '$app = Get-ChildItem package/*.exe; ./release/desktop/check-nsis.ps1 -Installer $app.FullName -Desktop runtime/packages/desktop' ;;
            Linux) node runtime/packages/desktop/e2e/verify-linux-image.js /opt/ave/AVE.AppImage ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-demo-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/installed-demo/demo.json
            ${{ runner.temp }}/installed-demo/manifest.json
            ${{ runner.temp }}/installed-demo/output.mp4
            ${{ runner.temp }}/installed-demo/*.png
            ${{ runner.temp }}/installed-demo/failure.txt
          if-no-files-found: ignore
