name: Native AVE desktop installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, platform: mac }
          - { runner: windows-2025, arch: x64, platform: win }
          - { runner: ubuntu-24.04, arch: x64, platform: linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mirror/x264
          ref: 31e19f92f00c7003fa115047ce50978bc98c3a0d
          path: native/x264
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 38b88335f99e76ed89ff3c93f877fdefce736c13
          path: native/ffmpeg
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build native workspace
        run: |
          npm ci --no-audit --no-fund
          node apps/web/scripts/build.mjs
          npm run typecheck
          python release/desktop/bundle-python.py native-media
      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Install native tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config xvfb xauth fonts-noto-cjk libfuse2t64
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: git make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-zlib
      - name: Build native media tools
        if: runner.os != 'Windows'
        run: release/desktop/build-media.sh native/x264 native/ffmpeg native-media
      - name: Build Windows media tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: release/desktop/build-media.sh native/x264 native/ffmpeg native-media
      - name: Package native desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/ave-builder" electron-builder@26.18.0 --no-audit --no-fund
          python release/desktop/native/pack.py --builder-cli "$RUNNER_TEMP/ave-builder/node_modules/electron-builder/cli.js" --media native-media --output dist/installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AVE-native-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/installers/*.exe
            dist/installers/*.dmg
            dist/installers/*.AppImage
