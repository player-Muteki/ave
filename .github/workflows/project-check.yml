name: project-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Read Paseo statistics baseline
        id: baseline
        run: python3 -c 'import json; print("pin=" + next(r["commit"] for r in json.load(open("research/upstream.json"))["references"] if r["path"] == "paseo"))' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: getpaseo/paseo
          ref: ${{ steps.baseline.outputs.pin }}
          path: paseo
          persist-credentials: false
      - name: Check division attribution against a fixture
        run: python3 scripts/test_update_division.py
      - name: Check documentation, SVG and team metrics
        run: python3 scripts/check_project.py
