name: AVE desktop candidate

on:
  workflow_dispatch:
    inputs:
      sign:
        type: boolean
        description: Sign and verify the macOS and Windows installers
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, platform: mac }
          - { runner: windows-2025, arch: x64, platform: win }
          - { runner: ubuntu-24.04, arch: x64, platform: linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve locked Paseo source
        id: source
        run: node -e "console.log('sha='+require('./research/upstream.json').references.find(r=>r.path==='paseo').commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: getpaseo/paseo
          ref: ${{ steps.source.outputs.sha }}
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mirror/x264
          ref: 31e19f92f00c7003fa115047ce50978bc98c3a0d
          path: native/x264
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 38b88335f99e76ed89ff3c93f877fdefce736c13
          path: native/ffmpeg
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: downstream/paseo/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assemble AVE from the candidate commit
        run: |
          git archive HEAD:downstream/paseo | tar -x -C runtime
          git -C runtime apply ../release/desktop/identity.patch
          python release/desktop/bundle-python.py runtime/packages/desktop/native-media
      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Install native tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config xvfb xauth fonts-noto-cjk libfuse2t64
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: git make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-zlib
      - name: Build native media tools
        if: runner.os != 'Windows'
        run: release/desktop/build-media.sh native/x264 native/ffmpeg runtime/packages/desktop/native-media
      - name: Build Windows media tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: release/desktop/build-media.sh native/x264 native/ffmpeg runtime/packages/desktop/native-media
      - name: Install locked app dependencies
        working-directory: runtime
        run: npm ci --no-audit --no-fund
      - name: Build native installer
        working-directory: runtime
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CSC_LINK: ${{ inputs.sign && (runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && (runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.sign && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.sign && runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_SIGNING: ${{ inputs.sign && runner.os != 'Linux' }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          build_options=(--publish never "--$TARGET_PLATFORM" "--$TARGET_ARCH")
          if [[ "$REQUIRE_SIGNING" == true ]]; then
            : "${CSC_LINK:?Signing certificate unavailable}"
            if [[ "$TARGET_PLATFORM" == mac ]]; then
              : "${APPLE_ID:?Missing Apple ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization password}" "${APPLE_TEAM_ID:?Missing Apple team ID}"
              build_options+=(--config.dmg.sign=true)
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build:desktop -- "${build_options[@]}"
      - name: Notarize, staple and verify the signed disk image
        if: inputs.sign && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash release/desktop/notarize-dmg.sh runtime/packages/desktop/release/*.dmg
      - name: Verify Windows installer signature
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem runtime/packages/desktop/release/*.exe -ErrorAction Stop
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
          $signature | Format-List Status,SignerCertificate
      - name: Write candidate checksums
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          dest = pathlib.Path("runtime/packages/desktop/release")
          packages = [p for p in dest.iterdir() if p.suffix in {".dmg", ".exe", ".AppImage"}]
          if len(packages) != 1:
              raise SystemExit(f"Expected one installer, found {packages}")
          with packages[0].open("rb") as stream:
              sha = hashlib.file_digest(stream, "sha256").hexdigest()
          (dest / "SHA256SUMS").write_text(f"{sha}  {packages[0].name}\n")
          (dest / "SOURCE_SHA").write_text(os.environ["GITHUB_SHA"] + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AVE-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            runtime/packages/desktop/release/*.dmg
            runtime/packages/desktop/release/*.exe
            runtime/packages/desktop/release/*.AppImage
            runtime/packages/desktop/release/SHA256SUMS
            runtime/packages/desktop/release/SOURCE_SHA
          if-no-files-found: error
      - name: Install and launch the DMG
        if: runner.os == 'macOS'
        env:
          AVE_VERIFY_APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: release/desktop/check-dmg.sh runtime/packages/desktop/release/*.dmg runtime/packages/desktop
      - name: Install and launch the NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          $installer = Get-ChildItem runtime/packages/desktop/release/*.exe
          ./release/desktop/check-nsis.ps1 -Installer $installer.FullName -Desktop runtime/packages/desktop
      - name: Launch the AppImage with its sandbox
        if: runner.os == 'Linux'
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          sudo install -d -m 0755 /opt/ave
          sudo install -m 0755 runtime/packages/desktop/release/*.AppImage /opt/ave/AVE.AppImage
          sudo install -m 0644 release/desktop/ave-appimage.apparmor /etc/apparmor.d/ave-appimage
          sudo apparmor_parser -r /etc/apparmor.d/ave-appimage
          node runtime/packages/desktop/e2e/verify-linux-image.js /opt/ave/AVE.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
