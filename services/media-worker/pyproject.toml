[project]
name = "ave-media-worker"
version = "0.1.0"
description = "Isolated Python media/CV/generative worker kernels invoked by the native AVE daemon."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.optional-dependencies]
analysis = [
  "scenedetect>=0.6.4",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18",
]
gpu = [
  "torch>=2.3",
  "sam2>=1.0",
  "diffusers>=0.32",
  "transformers>=4.46",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
